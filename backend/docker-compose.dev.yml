services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-my secret string}
      - MONGO_URL=mongodb://mongo:27017/deloitte
      - PORT=3000
    ports: ["3000:3000"]
    volumes:
      - ./:/usr/src/app # bind-mount source
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
